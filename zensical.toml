[project]
site_name = "Sphragis"
site_description = "A pre-registered test of whether an organization's house style is learnable from the code it reviews"
site_author = "AJ Barea"
site_url = "https://ajbarea.github.io/sphragis/"
repo_url = "https://github.com/ajbarea/sphragis"
repo_name = "ajbarea/sphragis"
copyright = "AJ Barea"

# The nav is the list of what deploys: `scripts/prune_site.py` removes every built page it does
# not name, and a section publishes its folder. The research log is published as a dated journal
# under log/, generated from docs/research-log.md by `scripts/log_to_blog.py` before the build.
nav = [
  { "Home" = "index.md" },
  { "Protocol" = "protocol.md" },
  { "Registered decisions" = "registered-decisions.md" },
  { "Outcome-neutral tests" = "outcome-neutral.md" },
  { "Artifact index" = "artifacts.md" },
  { "Scripts" = "scripts.md" },
  { "Research log" = ["log/index.md"] },
]

extra_css = ["stylesheets/landing.css", "stylesheets/extra.css"]
extra_javascript = ["javascripts/reveal.js"]

# ---------------------------------------------------------------------------
# Theme
# ---------------------------------------------------------------------------
[project.theme]
name = "material"
language = "en"
custom_dir = "overrides"

features = [
    # Announcement bar
    "announce.dismiss",

    # Code blocks
    "content.code.annotate",
    "content.code.copy",
    "content.code.select",

    # Content features
    "content.footnote.tooltips",
    "content.tabs.link",
    "content.tooltips",

    # Navigation
    "navigation.footer",
    "navigation.indexes",
    "navigation.instant",
    "navigation.instant.prefetch",
    "navigation.instant.progress",
    "navigation.path",
    "navigation.sections",
    "navigation.top",
    "navigation.tracking",

    # Search
    "search.highlight",
    "search.suggest",
]

# ---------------------------------------------------------------------------
# Color palette — light/dark toggle. Sealing wax against ink, which is the one
# pairing the name earns; the sisters take indigo/amber and teal/deep-purple.
# ---------------------------------------------------------------------------
[[project.theme.palette]]
scheme = "slate"
primary = "deep-orange"
accent = "indigo"
toggle.icon = "lucide/sun"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
scheme = "default"
primary = "deep-orange"
accent = "indigo"
toggle.icon = "lucide/moon"
toggle.name = "Switch to dark mode"

# ---------------------------------------------------------------------------
# Fonts
# ---------------------------------------------------------------------------
[project.theme.font]
text = "Inter"
code = "JetBrains Mono"

# ---------------------------------------------------------------------------
# Icon
# ---------------------------------------------------------------------------
[project.theme.icon]
logo = "material/seal"

# ---------------------------------------------------------------------------
# Social links (footer)
# ---------------------------------------------------------------------------
[project.extra]
generator = false

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/ajbarea/sphragis"
name = "Sphragis on GitHub"

# ---------------------------------------------------------------------------
# The research log as a journal: one post per dated entry, newest first.
# ---------------------------------------------------------------------------
[project.plugins.blog]
blog_dir = "log"
post_date_format = "long"
post_url_format = "{date}/{slug}"
archive_date_format = "MMMM yyyy"
archive_url_format = "archive/{date}"
categories_url_format = "category/{slug}"
pagination_per_page = 15
post_readtime = true
