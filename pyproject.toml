[project]
name = "sphragis"
version = "0.1.0"
description = "Can a model learn an organization's house style from its code review? Corpus, measurement and experiment."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AJ Barea" }]
requires-python = ">=3.12,<3.15"
keywords = ["code-review", "gerrit", "mining-software-repositories", "registered-report", "lora"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Corpus construction and measurement are standard library only, by design: the
# measurement must run without a GPU. The model stack arrives with plan C, under
# `experiment`, and is pinned exactly rather than floated.
dependencies = []

[project.optional-dependencies]
# The model stack. Only sphragis/experiment/model.py may import any of it.
experiment = [
    "torch>=2.12",
    "transformers>=5.10",
    "peft>=0.10",
    "accelerate>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "ruff>=0.15.16",
    "ty>=0.0.44,<0.1",
]

[project.scripts]
sphragis-corpus = "sphragis.corpus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sphragis"]

# =============================================================================
# uv — torch: CUDA 13.0 on Linux, both TIGRIS (aarch64 GH200) and SPORC (x86_64 A100/H100),
# CPU wheels on macOS and Windows. Both clusters run driver 610, a CUDA 13 runtime, so the
# cu128 wheels do not apply. CI installs no extras, so it never downloads either torch.
# =============================================================================
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["sphragis", "tests"]

# CI installs the dev group only, so the model stack is absent there and ty cannot resolve
# it. That is deliberate: lint stays fast and needs no GPU wheels. Locally, where the
# `experiment` extra IS installed, ty resolves the real stubs and type-checks against them
# — which is stricter, and is what caught the loose typing in model.py.
# A `ty: ignore` needed where the model stack resolves is necessarily unused where it does
# not, and CI is the second case: it installs the dev group only. Downgraded to a warning
# so one suppression cannot make the two environments mutually unsatisfiable. `make lint`
# still fails on any real error.
[tool.ty.rules]
unused-ignore-comment = "ignore"

[tool.ty.analysis]
allowed-unresolved-imports = [
    "torch",
    "torch.**",
    "transformers",
    "transformers.**",
    "peft",
    "peft.**",
    "accelerate",
    "accelerate.**",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
