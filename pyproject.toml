[project]
name = "sphragis"
version = "0.1.0"
description = "Does an organization leave a learnable fingerprint in its code review? Corpus, measurement and experiment."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AJ Barea" }]
requires-python = ">=3.12,<3.15"
keywords = ["code-review", "gerrit", "mining-software-repositories", "registered-report", "lora"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Corpus construction and measurement are standard library only, by design: the
# measurement must run without a GPU. The model stack arrives with plan C, under
# `experiment`, and is pinned exactly rather than floated.
dependencies = []

[project.optional-dependencies]
experiment = []

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "ruff>=0.15.16",
    "ty>=0.0.44,<0.1",
]

[project.scripts]
sphragis-corpus = "sphragis.corpus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sphragis"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
