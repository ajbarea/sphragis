[project]
name = "sphragis"
version = "0.1.0"
description = "Does an organization leave a learnable fingerprint in its code review? Corpus, measurement and experiment."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "AJ Barea" }]
requires-python = ">=3.12,<3.15"
keywords = ["code-review", "gerrit", "mining-software-repositories", "registered-report", "lora"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Corpus construction and measurement are standard library only, by design: the
# measurement must run without a GPU. The model stack arrives with plan C, under
# `experiment`, and is pinned exactly rather than floated.
dependencies = []

[project.optional-dependencies]
# The model stack. Only sphragis/experiment/model.py may import any of it.
experiment = [
    "torch>=2.12",
    "transformers>=5.10",
    "peft>=0.10",
    "accelerate>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=6.0",
    "ruff>=0.15.16",
    "ty>=0.0.44,<0.1",
]

[project.scripts]
sphragis-corpus = "sphragis.corpus.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sphragis"]

# =============================================================================
# uv — torch: CUDA 13.0 on Linux aarch64 (TIGRIS GH200), CPU wheels everywhere else.
# The GH200 driver is 610, which is a CUDA 13 runtime; the cu128 wheels do not apply.
# =============================================================================
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu130", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux' or platform_machine != 'aarch64'" },
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
