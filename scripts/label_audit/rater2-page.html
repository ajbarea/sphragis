<title>Label Audit Second Rater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/*__STYLE__*/
.wrap{max-width:1320px}
header p{color:var(--ink)}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;padding:0;list-style:none}
.facts li{background:var(--chip);border-radius:999px;padding:4px 12px;font-size:14px}
.privacy{margin:10px 0 0;font-size:14px;color:var(--muted);max-width:75ch}
.resume{margin-top:16px}
.card{gap:16px}
.card-head{align-items:center}
.pair{display:grid;gap:20px}
.pair>*{min-width:0}
.show,.ask{display:grid;gap:12px;align-content:start}
@media (min-width:960px){
  .pair{grid-template-columns:minmax(0,1fr) minmax(420px,520px)}
  .ask{border-left:1px solid var(--rule);padding-left:20px}
  /* The item stays in view while the answers beside it scroll. */
  .show{position:sticky;top:64px;align-self:start;max-height:calc(100vh - 80px);overflow:auto}
}
.ask h2{font-size:15px;font-weight:600;margin:0;max-width:60ch}
.opts{display:grid;gap:6px}
.opt{display:grid;gap:2px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--edge);border-radius:8px;padding:8px 12px 8px 34px;cursor:pointer;position:relative}
.opt::before{content:"";position:absolute;left:11px;top:13px;width:14px;height:14px;border-radius:50%;border:1.5px solid var(--edge);box-sizing:border-box}
.opt .name{font-weight:600}
.opt .def{font-size:14px;line-height:1.45;color:var(--muted)}
.opt[aria-pressed="true"]{background:var(--sel);border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.opt[aria-pressed="true"]::before{border:4.5px solid var(--accent)}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt:disabled{cursor:default}
.opt:disabled:not([aria-pressed="true"]){opacity:.6}
.opt:focus-visible,.flag input:focus-visible,details.tricky summary:focus-visible,details.about summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
details.tricky,details.about{border:1px solid var(--rule);border-radius:8px;padding:8px 12px;background:var(--panel)}
details.tricky summary,details.about summary{cursor:pointer;font-weight:500}
details.tricky p,details.about p,details.about li{margin:8px 0 0;max-width:72ch}
details.about{margin-top:20px;padding:12px 16px}
details.about ul{margin:8px 0 0;padding-inline-start:20px;display:grid;gap:6px}
.q2{display:grid;gap:6px;border-top:1px solid var(--rule);padding-top:12px}
.q2 p{margin:0}
.flag{display:flex;gap:8px;align-items:flex-start;font-weight:500;cursor:pointer}
.flag input{margin-top:5px;width:16px;height:16px;accent-color:var(--accent);flex:none}
.answer-line{font-size:14px;color:var(--muted)}
.answer-line b{color:var(--ink);font-weight:600}
.locked-line{font-size:14px;color:var(--done);font-weight:500}
.lock-hint{font-size:14px;color:var(--muted);margin:0}
.check{border-top:1px dashed var(--rule);padding-top:10px;display:grid;gap:6px}
.check .verdict{font-size:14px;font-weight:500}
.agree{color:var(--done)} .differ{color:var(--del-ink)}
.slips{display:flex;flex-wrap:wrap;gap:4px 14px}
.slips label{display:inline-flex;gap:6px;align-items:center}
.tip{font-size:14px;color:var(--muted);margin:0}
.tip kbd{font-family:var(--mono);font-size:13px;background:var(--chip);border:1px solid var(--rule);border-radius:4px;padding:0 5px;color:var(--ink)}
.done{text-align:center;padding:32px 20px;margin-top:20px;background:var(--panel);border:1px solid var(--rule);border-radius:8px}
.done h2{font-size:20px;margin:0 0 8px}
.done p{margin:0}
.err{color:var(--del-ink)}
.err:empty{display:none}
.milestone{color:var(--done);font-weight:500}
</style>
<div class="wrap">
  <header>
    <h1>Help check code-review labels</h1>
    <p id="lede">Each item is one code review: a reviewer's comment and the change that followed. Read it and pick the answer that fits.</p>
  </header>

  <div class="status" role="status" aria-live="polite">
    <span class="count" id="count"></span>
    <div class="meter" aria-hidden="true"><span id="bar"></span></div>
    <span class="note" id="conn">Connecting…</span>
  </div>
  <div class="banner" id="notice" hidden></div>

  <main id="stage"></main>
</div>

<script>
const ITEMS = __DATA__;
const LABELS = ["valid","non_actionable","unrelated_rewrite","partial","context_dependent"];
const RUBRIC = "v2";
const DEFINITIONS = {
  valid: "The comment asks for a change and the rewrite makes it. Extra edits alongside are fine.",
  non_actionable: "The comment asks for no change (praise, FYI, agreement, a question the author could answer in words), or it withdraws its own request.",
  unrelated_rewrite: "The requested change is absent; the code changed for some other reason.",
  partial: "The rewrite makes part of what was asked, or makes it in a clearly different way than the comment suggested.",
  context_dependent: "You cannot tell what the comment asks for from what is shown: \"same here\", \"see above\", a reference to other lines, files or patch sets, a bare \"?\" or \"why?\", \"remove\" without saying what, or only a link."
};
// What a button says; the answer stored is always the label it names.
const NAMES = {
  valid: "Valid",
  non_actionable: "No change asked",
  unrelated_rewrite: "Unrelated change",
  partial: "Partly done",
  context_dependent: "Can't tell"
};
// The rubric's rules, worded as before; {label} is shown as that label's name.
const Q1_ASK = "1. The label: did the reviewer ask for a change, and is the rewrite the author's answer to it? Pick one.";
const TRICKY = "{context_dependent} is about understanding the request. A clear request answered with names defined elsewhere is still {valid}; that is question 2. Several comments: judge the requests together. All made is {valid}, some is {partial}, none is {unrelated_rewrite}; ignore comments that ask for nothing when others do. A deletion the comment asked for is {valid}, and a question the author answers by changing the code counts as a request. Judge only what is shown; do not guess the project or the author.";
const Q2_ASK = "2. Names from outside: does the rewrite use a name or value that appears nowhere in the item, not in the before lines, the surrounding lines or the comment (a helper, constant, module, class, config key, file name, version or hash defined elsewhere)?";
const Q2_RULES = "A name the comment spells out counts as shown. New local variable names, plain rewording and ordinary library or language names (open, len, std::move) do not count. Answer it for every item, whatever its label.";
const GOAL = Math.min(10, ITEMS.length);
// The rubric's invented worked example: a practice item, never saved and never counted.
const PRACTICE = {
  path: "service/status.py",
  comments: ["This string is compared against in other modules; please make it a constant."],
  cb: "", b: "status = \"Service unavailable\"", a: "status = errors.SERVICE_UNAVAILABLE", ca: "",
  label: "valid", outside: true,
  why: "The request is clear and the rewrite makes it, so the label is valid. The module errors and the constant's name appear nowhere in the item, so the second answer is yes."
};

const answers = {};   // item -> the locked answer, as the store holds it
const drafts = {};    // item -> {label, outside, note}: unlocked choices, kept only on this page
let db = null, uid = null, mode = "connecting", screen = "intro", current = 0, loaded = false, busy = false;
let practice = {label:null, outside:false, checked:false};
const shown = {tricky:false, about:false};  // toggles stay as the rater left them between items

function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
function keyed(e, key){ e.dataset.key=key; return e; }
function named(text){ return text.replace(/\{(\w+)\}/g,(_,lab)=>"“"+NAMES[lab]+"”"); }
function diffBlock(ex){
  const box=el("div","diff"), pre=el("pre");
  const add=(text,cls,prefix)=>{ if(!text) return; for(const line of text.split("\n")) pre.appendChild(el("span",cls,prefix+line+"\n")); };
  add(ex.cb,"ctx","  "); add(ex.b,"del","- "); add(ex.a,"add","+ "); add(ex.ca,"ctx","  ");
  box.appendChild(pre); return box;
}
function lockedCount(){ return ITEMS.filter(x=>answers[x.item]).length; }
function firstOpen(){ const i=ITEMS.findIndex(x=>!answers[x.item]); return i<0?ITEMS.length-1:i; }
function notice(text){ const n=document.getElementById("notice"); n.hidden=!text; n.textContent=text||""; }
function progress(){
  // The bar first fills toward a small goal, then toward the whole set.
  const k=lockedCount(), toGoal=k<GOAL, of=toGoal?GOAL:ITEMS.length;
  document.getElementById("count").textContent=toGoal?k+" of "+GOAL+" to start":k+" of "+ITEMS.length+" locked";
  document.getElementById("bar").style.width=(of?100*k/of:0)+"%";
}
function toggle(cls, key, summary, fill){
  const d=keyed(el("details",cls),key); d.open=shown[key];
  d.addEventListener("toggle",()=>{ shown[key]=d.open; });
  d.appendChild(keyed(el("summary",null,summary),key+"-summary")); fill(d);
  return d;
}

function choiceGroup(selected, disabled, onPick){
  const ch=el("div","opts"); ch.setAttribute("role","group"); ch.setAttribute("aria-label","Label");
  LABELS.forEach(lab=>{
    const b=keyed(el("button","opt"),"opt-"+lab); b.type="button"; b.disabled=disabled;
    const name=el("span","name",NAMES[lab]), def=el("span","def",DEFINITIONS[lab]);
    name.id="name-"+lab; def.id="def-"+lab;
    b.setAttribute("aria-labelledby",name.id); b.setAttribute("aria-describedby",def.id);
    b.append(name, def);
    b.setAttribute("aria-pressed",String(selected===lab));
    b.addEventListener("click",()=>onPick(lab));
    ch.appendChild(b);
  });
  return ch;
}
function questionTwo(checked, disabled, onChange){
  const q=el("div","q2");
  q.appendChild(el("p",null,Q2_ASK));
  q.appendChild(el("p","note",Q2_RULES));
  const flag=el("label","flag"); const box=keyed(el("input"),"outside"); box.type="checkbox"; box.disabled=disabled; box.checked=checked;
  box.addEventListener("change",()=>onChange(box.checked));
  flag.append(box, el("span",null,"Yes: the rewrite uses names or values not shown in the item"));
  q.appendChild(flag);
  return q;
}
function askPanel(selected, outside, disabled, onPick, onOutside){
  const ask=el("div","ask");
  ask.appendChild(el("h2",null,Q1_ASK));
  ask.appendChild(choiceGroup(selected, disabled, onPick));
  ask.appendChild(toggle("tricky","tricky","Tricky cases",d=>d.appendChild(el("p","note",named(TRICKY)))));
  ask.appendChild(questionTwo(outside, disabled, onOutside));
  return ask;
}
function showPanel(ex){
  const show=el("div","show");
  show.appendChild(el("span","path",ex.path));
  const cs=el("div","comments");
  cs.appendChild(el("span","label-small","Reviewer comment"+(ex.comments.length>1?"s":"")));
  ex.comments.forEach(c=>cs.appendChild(el("div","comment",c)));
  show.appendChild(cs);
  const d=el("div"); d.appendChild(el("span","label-small","Next revision (− before, + after)")); d.appendChild(diffBlock(ex)); show.appendChild(d);
  return show;
}
function keysTip(lock){
  const p=el("p","tip"); p.append("Tip: keys ");
  const k=t=>el("kbd",null,t);
  p.append(k("1"),"–",k("5")," pick an answer top to bottom, ",k("x")," ticks question 2, ",k("Enter")," "+lock);
  if(lock==="locks") p.append(", ",k("n")," and ",k("p")," move between items.");
  else p.append(".");
  return p;
}
function navButton(text, key, onClick, primary){
  const b=keyed(el("button",primary?"primary":null,text),key); b.type="button"; b.onclick=onClick; return b;
}
function startItems(at){ screen="items"; current=at; render(); window.scrollTo({top:0}); }

function aboutStudy(){
  return toggle("about","about","About this study",d=>{
    d.appendChild(el("p",null,"Each item is one code review: a reviewer's comment on a few lines of code, and how those lines looked in the author's next revision. You answer two questions about each. AJ labeled the same "+ITEMS.length+" items earlier; a second careful reader's labels show how often two people agree, a figure the study reports."));
    d.appendChild(el("p",null,"All "+ITEMS.length+" items take about an hour in total. Any number helps; "+GOAL+" is a good start."));
    const ul=el("ul");
    [
      "Your answers are blind. You will not see AJ's labels or the model raters' labels, before or after you answer.",
      "Nobody else using this page sees your answers. AJ reads them, by item, only to compute agreement; your name is not attached to them in anything published.",
      "You can change an answer until you lock it. A locked answer is final, so lock when you are sure. If you mis-click, you can mark the locked answer as a slip; it stays as locked.",
      "Judge only what is shown. Some items are hard; your best reading is exactly what is wanted.",
      "Everyone who helps is thanked in the paper's acknowledgments."
    ].forEach(t=>ul.appendChild(el("li",null,t)));
    d.appendChild(ul);
  });
}

function renderIntro(stage){
  const facts=el("ul","facts");
  ["Under a minute each","Stop anytime: progress saves",GOAL+" to start is a big help"].forEach(t=>facts.appendChild(el("li",null,t)));
  stage.appendChild(facts);
  stage.appendChild(el("p","privacy","Your answers are blind and private: you won't see anyone else's labels, and only AJ reads yours."));
  if(lockedCount()){
    const nav=el("div","nav resume");
    nav.appendChild(navButton("Continue where I left off","resume",()=>startItems(firstOpen()),true));
    stage.appendChild(nav);
  }
  const card=el("section","card current");
  const head=el("div","card-head");
  head.appendChild(el("span","num","Practice item: invented, not saved, not counted"));
  card.appendChild(head);
  const pair=el("div","pair");
  pair.appendChild(showPanel(PRACTICE));
  const ask=askPanel(practice.label, practice.outside, practice.checked,
    lab=>{ practice.label=lab; render(); }, v=>{ practice.outside=v; });
  const nav=el("div","nav");
  if(!practice.checked){
    const check=navButton("Check my practice answer","check",()=>{ practice.checked=true; render(); },true);
    check.disabled=!practice.label;
    nav.appendChild(check);
    if(!lockedCount()) nav.appendChild(navButton("Skip practice","skip",()=>startItems(0)));
  } else {
    nav.append(navButton(lockedCount()?"Back to my items":"Start item 1","start",()=>startItems(firstOpen()),true),
      navButton("Try it again","again",()=>{ practice={label:null,outside:false,checked:false}; render(); }));
  }
  ask.appendChild(nav);
  if(practice.checked){
    const r=el("div","check");
    const okLabel=practice.label===PRACTICE.label, okNames=practice.outside===PRACTICE.outside;
    r.appendChild(el("div","verdict "+(okLabel?"agree":"differ"),"Label: Valid"+(okLabel?" (you agree)":" (you chose "+NAMES[practice.label]+")")));
    r.appendChild(el("div","verdict "+(okNames?"agree":"differ"),"Names from outside: yes"+(okNames?" (you agree)":" (you said no)")));
    r.appendChild(el("div","note",PRACTICE.why));
    r.appendChild(el("div","note","This is the only answer you will see. The "+ITEMS.length+" items show none."));
    ask.appendChild(r);
  }
  ask.appendChild(keysTip("checks"));
  pair.appendChild(ask);
  card.appendChild(pair);
  stage.appendChild(card);
  stage.appendChild(aboutStudy());
}

function renderItem(stage){
  const ex=ITEMS[current], s=answers[ex.item], locked=!!s;
  const draft=drafts[ex.item]||(drafts[ex.item]={label:null,outside:false,note:""});
  const card=el("section","card current");
  const head=el("div","card-head");
  head.appendChild(el("span","num","Item "+(current+1)+" of "+ITEMS.length));
  const home=el("div","nav");
  home.appendChild(navButton("Start page","home",()=>{ screen="intro"; render(); window.scrollTo({top:0}); }));
  head.appendChild(home);
  card.appendChild(head);
  const pair=el("div","pair");
  pair.appendChild(showPanel(ex));
  const frozen=locked||busy;
  const ask=askPanel(locked?s.label:draft.label, locked?!!s.outside_names:draft.outside, frozen,
    lab=>{ draft.label=lab; render(); }, v=>{ draft.outside=v; render(); });
  if(!locked){
    const ta=keyed(el("textarea"),"note"); ta.placeholder="Optional note, saved with your answer when you lock it"; ta.value=draft.note; ta.disabled=busy;
    ta.setAttribute("aria-label","Optional note");
    ta.addEventListener("input",()=>{ draft.note=ta.value; });
    ask.appendChild(ta);
    const line=el("div","answer-line");
    if(draft.label){ line.append("Your answer: ", el("b",null,NAMES[draft.label]), " · names from outside: ", el("b",null,draft.outside?"yes":"no")); }
    else line.textContent="Pick an answer to lock this item.";
    ask.appendChild(line);
  } else {
    ask.appendChild(el("div","locked-line","Locked: "+NAMES[s.label]+" · names from outside: "+(s.outside_names?"yes":"no")));
    if(s.note) ask.appendChild(el("div","note","Your note: "+s.note));
    const slips=el("div","note slips"); slips.appendChild(el("span",null,"Mis-click? Mark it; your locked answer stays as it is:"));
    for(const [field,text] of [["label","answer was a slip"],["outside_names","names answer was a slip"]]){
      const lab=el("label"); const cb=keyed(el("input"),"slip-"+field); cb.type="checkbox"; cb.checked=(s.slips||[]).includes(field); cb.disabled=busy||mode!=="saving";
      cb.addEventListener("change",()=>markSlip(ex.item, field, cb.checked));
      lab.append(cb,text); slips.appendChild(lab);
    }
    ask.appendChild(slips);
  }
  const nav=el("div","nav");
  const prev=navButton("Previous","prev",()=>go(-1)); prev.disabled=current===0;
  const lock=navButton(locked?"Locked":(busy?"Saving…":"Lock answer"),"lock",lockCurrent,true);
  lock.disabled=locked||busy||!draft.label||!canLock();
  const next=navButton("Next","next",()=>go(1)); next.disabled=current===ITEMS.length-1;
  const jump=navButton("First open item","jump",()=>{ current=firstOpen(); render(); });
  nav.append(prev,lock,next,jump); ask.appendChild(nav);
  if(!locked) ask.appendChild(el("p","lock-hint","A locked answer is final; you can still mark a mis-click."));
  const err=el("div","saved err"); err.id="err"; ask.appendChild(err);
  ask.appendChild(keysTip("locks"));
  pair.appendChild(ask);
  card.appendChild(pair);
  stage.appendChild(card);
  const k=lockedCount();
  if(k===ITEMS.length){
    const done=el("section","done");
    done.appendChild(el("h2",null,"All "+ITEMS.length+" locked. Thank you!"));
    done.appendChild(el("p",null,"Your answers are saved. You can close this page; AJ will take it from here."));
    stage.appendChild(done);
  } else if(k>=GOAL){
    stage.appendChild(el("p","milestone",k+" locked: thank you! Stop here or keep going; every item helps."));
  }
}

function canLock(){ return mode==="saving"||mode==="preview"; }
function render(){
  // The stage is rebuilt on every change, so focus returns to the control that held it.
  const had=document.activeElement&&document.activeElement.dataset?document.activeElement.dataset.key:null;
  const stage=document.getElementById("stage"); stage.textContent="";
  document.getElementById("lede").hidden=screen!=="intro";
  if(screen==="intro") renderIntro(stage);
  else renderItem(stage);
  progress();
  if(had){ const back=stage.querySelector('[data-key="'+had+'"]'); if(back&&!back.disabled) back.focus({preventScroll:true}); }
}
function go(step){ current=Math.max(0,Math.min(ITEMS.length-1,current+step)); render(); window.scrollTo({top:0}); }

async function lockCurrent(){
  const ex=ITEMS[current], draft=drafts[ex.item];
  if(busy||answers[ex.item]||!draft||!draft.label||!canLock()) return;
  const body={rubric:RUBRIC,label:draft.label,outside_names:!!draft.outside,note:draft.note.trim(),slips:[],locked_at:new Date().toISOString()};
  if(mode==="preview"){ answers[ex.item]=body; afterLock(); return; }
  busy=true; render();
  try{
    // Another tab may have locked this item first; a locked answer is never overwritten.
    const ref=db.doc("answers/"+uid+"/items/"+ex.item);
    const prior=await ref.get();
    if(prior.exists){
      const v=prior.data(), ok=v&&v.rubric===RUBRIC&&LABELS.includes(v.label);
      if(ok) answers[ex.item]=v;
      busy=false; render();
      const err=document.getElementById("err");
      if(err) err.textContent=ok?"This item was already locked, in another tab or device; that answer is kept."
        :"A saved entry for this item cannot be read, so it cannot be locked here. Please tell AJ.";
      return;
    }
    await ensureMarker();
    await ref.set(body);
    answers[ex.item]=body; busy=false; afterLock();
  }catch(e){
    busy=false; render(); saveFailed(e);
  }
}
// A refusal ends saving for this visit; anything else is worth trying again.
const REFUSALS=["invalid_argument","transform_error","not_granted","revoked","capability_disabled","capability_removed"];
function isRefusal(code){ return REFUSALS.includes(code); }
function saveFailed(e){
  const code=e&&e.code;
  if(isRefusal(code)){ mode="readonly"; notice(refusedText()); render(); return; }
  const err=document.getElementById("err")||{set textContent(t){ notice(t); }};
  err.textContent=code==="quota_exceeded"?"Not saved: this page's storage is full. Please tell AJ."
    :code==="resource_exhausted"?"Not saved: too many saves at once. Wait a moment and try again."
    :"Not saved. Check your connection and try again.";
}
function afterLock(){
  if(current<ITEMS.length-1&&lockedCount()<ITEMS.length) current=firstOpenAfter(current);
  render(); window.scrollTo({top:0});
}
function firstOpenAfter(i){ for(let k=i+1;k<ITEMS.length;k++) if(!answers[ITEMS[k].item]) return k; return firstOpen(); }
let markerWritten=false;
async function ensureMarker(){
  // answers/<id> marks that this rater has answers, so they can be listed for the read-back.
  if(markerWritten) return;
  const ref=db.doc("answers/"+uid);
  if(!(await ref.get()).exists) await ref.set({rubric:RUBRIC});
  markerWritten=true;
}
async function markSlip(item, field, on){
  const s=answers[item]; if(!s||busy) return;
  const cur=new Set(s.slips||[]); on?cur.add(field):cur.delete(field);
  const slips=[...cur].sort();
  busy=true; render();
  let failed=null;
  try{ await db.doc("answers/"+uid+"/items/"+item).update({slips}); answers[item]={...answers[item],slips}; }
  catch(e){ failed=e; }
  busy=false; render();
  if(failed) saveFailed(failed);
}
function readonlyText(){ return "Saving is not available in this view, so nothing you pick here is kept. Open the page from the link AJ sent you, signed in to Claude, to save your answers."; }
function refusedText(){ return "This page could not save your answer, so nothing you pick here is kept. Your access may not allow saving; please tell AJ, who can change it. Answers you locked before are kept."; }

document.addEventListener("keydown",e=>{
  const tag=e.target.tagName;
  if(tag==="TEXTAREA"||e.ctrlKey||e.metaKey||e.altKey) return;
  if(screen==="intro"){
    if(practice.checked) return;
    if(e.key>="1"&&e.key<="5"){ practice.label=LABELS[+e.key-1]; render(); }
    else if(e.key==="x"){ practice.outside=!practice.outside; render(); }
    else if(e.key==="Enter"&&practice.label&&tag!=="BUTTON"&&tag!=="SUMMARY"){ e.preventDefault(); practice.checked=true; render(); }
    return;
  }
  const ex=ITEMS[current], locked=!!answers[ex.item];
  const draft=drafts[ex.item]||(drafts[ex.item]={label:null,outside:false,note:""});
  if(e.key>="1"&&e.key<="5"&&!locked&&!busy){ draft.label=LABELS[+e.key-1]; render(); }
  else if(e.key==="x"&&!locked&&!busy){ draft.outside=!draft.outside; render(); }
  else if(e.key==="Enter"&&!locked&&draft.label&&tag!=="BUTTON"&&tag!=="SUMMARY"){ e.preventDefault(); lockCurrent(); }
  else if(e.key==="n") go(1); else if(e.key==="p") go(-1);
});
render();

(async()=>{
  const conn=document.getElementById("conn");
  let user=null;
  try{ [db,user]=await Promise.all([window.claude?.use?.("db"),window.claude?.use?.("user")]); }catch(e){ db=null; user=null; }
  uid=user?await user.id():null;
  const owner=user?await user.isOwner():false;
  if(owner){
    mode="preview"; conn.textContent="Preview";
    notice("You own this page, so this is a preview: answers you lock here are not saved.");
    render(); return;
  }
  if(!db||!uid){ mode="readonly"; conn.textContent="Not saving"; notice(readonlyText()); render(); return; }
  mode="saving"; conn.textContent="Loading your answers…";
  const timer=setTimeout(()=>{ if(!loaded) conn.textContent="Your saved answers can't be reached yet"; },10000);
  db.collection("answers/"+uid+"/items").onSnapshot(snap=>{
    for(const d of snap.docs){
      const v=d.data();
      if(v&&v.rubric===RUBRIC&&LABELS.includes(v.label)) answers[d.id]=v;
    }
    markerWritten=markerWritten||snap.size>0;
    if(!snap.metadata.fromCache){
      clearTimeout(timer); conn.textContent="Progress saves as you lock";
      // A returning rater opens on their first open item; the start page stays one click away.
      if(!loaded){ loaded=true; if(lockedCount()){ current=firstOpen(); if(screen==="intro") screen="items"; } }
    }
    render();
  },e=>{
    clearTimeout(timer); mode="readonly"; conn.textContent="Not saving";
    const code=e&&e.code;
    notice(isRefusal(code)?refusedText():"Your saved answers can't be reached right now, so nothing you pick here is kept. Please reload the page in a few minutes.");
    render();
  });
})();
</script>
