name: Documentation

# Builds the Zensical site and publishes it to GitHub Pages. Matches the pattern the
# sister repositories use, including the SHA-pinned actions.
#
# The path filter is deliberate: a code change that alters what the docs *describe* still
# has to touch a docs file to say so. `datasets/**` is not a trigger, because a new
# measurement does not change the site until a page quotes it, and the harvest that
# asserts the quoted ones runs in CI on every push.

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "overrides/**"
      - "zensical.toml"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/docs.yml"
  # Build on PRs too, so a dependency bump that breaks the site fails on the PR rather
  # than on the deploy after it merges. The PR builds exactly what would deploy.
  #
  # Deliberately unfiltered, unlike the push trigger: a required check skipped by a paths
  # filter leaves unrelated PRs waiting on a status that never arrives.
  pull_request:
  # Publishing happens here and only here. See the deploy job.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.11.5
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      # The site quotes measurements. This fails the build when a page's figure no longer
      # rounds to the artifact behind it, and when the artifact index is stale.
      - name: Harvest the site's figures against their artifacts
        run: uv run --no-sync --no-active python harvest.py --check

      - name: Build documentation
        run: uv run --no-sync zensical build --clean

      # Zensical builds every page under docs/; the nav is the list of what deploys.
      - name: Keep only the pages the nav names
        run: uv run --no-sync --no-active python scripts/prune_site.py

      # The publish half of the job, and it runs on a manual dispatch only, so publishing
      # is a decision rather than a consequence of a merge. To publish, run this workflow
      # from the Actions tab on main.
      - name: Configure Pages
        if: github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

      - name: Minimize uv cache
        if: always()
        run: uv cache prune --ci

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: '${{ steps.deployment.outputs.page_url }}'
    runs-on: ubuntu-latest
    steps:
      # Ten minutes is the ceiling, not a choice: the action clamps to its maximum of
      # 600000ms, which is also its default, and anything larger logs "timeout value is
      # greater than the allowed maximum". Kept explicit at the maximum rather than
      # deleted, because the next person to meet a queued deployment reaches for this
      # input and the ceiling is the answer they need.
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        id: deployment
        with:
          timeout: 600000
