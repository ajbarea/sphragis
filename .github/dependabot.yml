version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    # cooldown: hold new releases 7d (supply-chain); security updates bypass it.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"
    # The model stack is frozen for the study: a bump mid-study changes what trained the adapters.
    # All three update types listed, so security updates still open.
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "transformers"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "peft"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]
      - dependency-name: "accelerate"
        update-types: ["version-update:semver-major", "version-update:semver-minor", "version-update:semver-patch"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # SHA-pinned actions get version updates (not security alerts); cooldown holds
    # a freshly-published release 7 days so a compromise can surface before the bump.
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"
